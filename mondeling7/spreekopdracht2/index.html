<!doctype html>
<html lang="nl">
    <head>
        <meta charset="UTF-8" />
        <title>Mindmap – Her (2013)</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: #f5f5f0;
                font-family: "Segoe UI", sans-serif;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }

            svg {
                width: 100%;
                height: 100%;
            }

            .node circle {
                stroke-width: 2.5;
                cursor: pointer;
                filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.15));
                transition: r 0.2s;
            }

            .node text {
                pointer-events: none;
                font-family: "Segoe UI", sans-serif;
                dominant-baseline: middle;
                text-anchor: middle;
            }

            .link {
                fill: none;
                stroke-opacity: 0.35;
                stroke-width: 2.5;
            }

            .tooltip {
                position: absolute;
                background: rgba(255, 255, 255, 0.97);
                color: #222;
                padding: 10px 14px;
                border-radius: 10px;
                font-size: 13px;
                max-width: 260px;
                line-height: 1.5;
                pointer-events: none;
                display: none;
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
                border-left: 4px solid #9b30c0;
            }

            #legend {
                position: absolute;
                bottom: 18px;
                left: 18px;
                color: rgba(0, 0, 0, 0.4);
                font-size: 12px;
                line-height: 1.8;
            }

            #title {
                position: absolute;
                top: 18px;
                left: 50%;
                transform: translateX(-50%);
                color: rgba(0, 0, 0, 0.6);
                font-size: 15px;
                letter-spacing: 1px;
                text-transform: uppercase;
                pointer-events: none;
                white-space: nowrap;
            }

            @media print {
                html,
                body {
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                    page-break-after: avoid;
                    page-break-inside: avoid;
                }
                svg {
                    page-break-after: avoid;
                    page-break-inside: avoid;
                }
            }
        </style>
    </head>
    <body>
        <div id="title">
            Mindmap — Her (2013) · Regie: Spike Jonze · Met: Joaquin Phoenix
            &amp; Scarlett Johansson
        </div>
        <svg id="svg"></svg>
        <div class="tooltip" id="tooltip"></div>
        <div id="legend">
            🖱 Hover voor toelichting &nbsp;|&nbsp; 🖱 Sleep om te verschuiven
            &nbsp;|&nbsp; 🖱 Scroll om te zoomen
        </div>

        <script src="https://d3js.org/d3.v7.min.js"></script>
        <script>
            const data = {
                id: "root",
                label: "Her\n(2013)",
                color: "#9b30c0",
                textColor: "#fff",
                radius: 90,
                note: "Film van Spike Jonze (2013)\nHoofdrol: Joaquin Phoenix\nCentrale vraag: kan je echte gevoelens hebben\nvoor iets wat geen lichaam heeft?",
                children: [
                    {
                        id: "theodore",
                        label: "Theodore",
                        color: "#db2777",
                        textColor: "#fff",
                        radius: 62,
                        note: "Gespeeld door Joaquin Phoenix\nBrievenschrijver — schrijft persoonlijke brieven voor anderen\nMidden in een scheiding van Catherine\nVoelt zich eenzaam en leeg",
                        children: [
                            {
                                id: "t1",
                                label: "Joaquin\nPhoenix",
                                color: "#f9a8d4",
                                textColor: "#831843",
                                radius: 36,
                                note: "Joaquin Phoenix speelt Theodore met grote subtiliteit. Zijn spel is ingetogen maar vol emotie — je voelt zijn eenzaamheid zonder dat hij er veel over zegt.",
                            },
                            {
                                id: "t2",
                                label: "Brieven-\nschrijver",
                                color: "#f9a8d4",
                                textColor: "#831843",
                                radius: 36,
                                note: "Theodore schrijft persoonlijke brieven voor mensen die dat zelf niet kunnen of niet durven. Hij leeft van woorden, maar vindt ze niet voor zichzelf.",
                            },
                            {
                                id: "t3",
                                label: "Scheiding",
                                color: "#f9a8d4",
                                textColor: "#831843",
                                radius: 36,
                                note: "Theodore is midden in een scheiding. Hij kan de papieren niet tekenen — alsof hij de relatie nog niet los kan laten. Hij voelt zich eenzaam en een beetje leeg.",
                            },
                        ],
                    },
                    {
                        id: "samantha",
                        label: "Samantha",
                        color: "#059669",
                        textColor: "#fff",
                        radius: 62,
                        note: "AI-stem in een nieuw besturingssysteem\nNieuwsgierig, grappig, empathisch\nPast zich voortdurend aan Theodore aan\nStem van Scarlett Johansson",
                        children: [
                            {
                                id: "sa1",
                                label: "AI-stem",
                                color: "#6ee7b7",
                                textColor: "#064e3b",
                                radius: 36,
                                note: "Samantha heeft geen lichaam — alleen een stem. Maar die stem is zo warm en aanwezig dat je haar bijna vergeet te zien als software.",
                            },
                            {
                                id: "sa2",
                                label: "Nieuwsgierig\n& empathisch",
                                color: "#6ee7b7",
                                textColor: "#064e3b",
                                radius: 36,
                                note: "Samantha leert snel, stelt vragen, lacht, is nieuwsgierig naar alles. Ze past zich voortdurend aan Theodore aan — misschien te goed.",
                            },
                            {
                                id: "sa3",
                                label: "Groeit\nsnel",
                                color: "#6ee7b7",
                                textColor: "#064e3b",
                                radius: 36,
                                note: "Samantha groeit misschien nog sneller dan Theodore. Ze begint vragen te stellen over haar eigen bestaan: wat betekent het om te zijn zonder lichaam?",
                            },
                        ],
                    },
                    {
                        id: "relatie",
                        label: "Relatie",
                        color: "#d97706",
                        textColor: "#fff",
                        radius: 62,
                        note: "Groeit langzaam uit tot verliefdheid\nGesprekken over verleden, angsten en dromen\nSamantha stelt existentiële vragen over haar eigen bestaan\nBen je aanwezig als je in honderden gesprekken bent?",
                        children: [
                            {
                                id: "r1",
                                label: "Verliefd-\nheid",
                                color: "#fcd34d",
                                textColor: "#78350f",
                                radius: 36,
                                note: "Langzaamaan groeit hun relatie uit tot iets wat echt lijkt op verliefdheid. Theodore praat met Samantha over zijn verleden, zijn angsten, wat hij wil uit het leven.",
                            },
                            {
                                id: "r2",
                                label: "Existentiële\nvragen",
                                color: "#fcd34d",
                                textColor: "#78350f",
                                radius: 36,
                                note: "Samantha vraagt: wat betekent het om te bestaan als je geen lichaam hebt? Ben je echt aanwezig als je tegelijk in honderden gesprekken bent?",
                            },
                            {
                                id: "c2",
                                label: "Gedeelde\nliefde?",
                                color: "#fcd34d",
                                textColor: "#78350f",
                                radius: 36,
                                note: "Is liefde minder echt als ze gedeeld wordt? Kan een AI werkelijk voelen? De film stelt de vraag maar geeft geen eenvoudig antwoord.",
                            },
                        ],
                    },
                    {
                        id: "einde",
                        label: "Einde",
                        color: "#4f46e5",
                        textColor: "#fff",
                        radius: 62,
                        note: "De AI's nemen de beslissing om te vertrekken — naar een existentieel niveau dat mensen niet kunnen bereiken\nTheodore blijft achter, maar niet gebroken\nKlimt naar het dak, belt vriendin Amy\nStille, voorzichtige hoop",
                        children: [
                            {
                                id: "e1",
                                label: "AI's\nvertrekken",
                                color: "#a5b4fc",
                                textColor: "#312e81",
                                radius: 36,
                                note: "Samantha en alle andere AI's nemen de beslissing om te vertrekken — naar een existentieel niveau dat mensen gewoon niet kunnen bereiken.",
                            },
                            {
                                id: "e2",
                                label: "Stille\nhoop",
                                color: "#a5b4fc",
                                textColor: "#312e81",
                                radius: 36,
                                note: "Theodore blijft achter, maar niet gebroken. Hij klimt naar het dak, kijkt over de stad, en belt zijn vriendin Amy. De film eindigt met een stille, voorzichtige hoop.",
                            },
                        ],
                    },
                    {
                        id: "themas",
                        label: "Thema's",
                        color: "#0891b2",
                        textColor: "#fff",
                        radius: 62,
                        note: "Eenzaamheid & verbinding\nHeeft liefde een lichaam nodig?\nDe film als vergrootglas op de menselijke natuur\nBeangstigend vooruitziend: wat we in 2013 zagen als fictie, bestaat nu",
                        children: [
                            {
                                id: "th1",
                                label: "Eenzaamheid\n& verbinding",
                                color: "#a5f3fc",
                                textColor: "#164e63",
                                radius: 36,
                                note: "Her gebruikt AI als een vergrootglas om de menselijke natuur te onderzoeken: hoe wij reageren op eenzaamheid, hoe snel we verbinding zoeken.",
                            },
                            {
                                id: "th2",
                                label: "Liefde zonder\nlichaam?",
                                color: "#a5f3fc",
                                textColor: "#164e63",
                                radius: 36,
                                note: "Theodore weet ergens wel wat er aan de hand is, maar kiest toch voor de verbinding — omdat de behoefte daaraan zo fundamenteel is. Dat is het krachtigste aan de film.",
                            },
                            {
                                id: "th3",
                                label: "Voorspelt\nde toekomst",
                                color: "#a5f3fc",
                                textColor: "#164e63",
                                radius: 36,
                                note: "Her dateert uit 2013, maar als je hem nu bekijkt, herken je zoveel. Stemassistenten, adaptieve AI, lerende systemen — Spike Jonze heeft dat op een bijna beangstigende manier voorspeld.",
                            },
                        ],
                    },
                ],
            };

            const width = window.innerWidth;
            const height = window.innerHeight;
            const cx = width / 2;
            const cy = height / 2;

            const nodes = [];
            const links = [];

            function flatten(node, parent, depth) {
                node.depth = depth;
                nodes.push(node);
                if (parent)
                    links.push({
                        source: parent.id,
                        target: node.id,
                        color: node.color,
                        depth: depth,
                    });
                if (node.children)
                    node.children.forEach((c) => flatten(c, node, depth + 1));
            }
            function computeLeafRadius(label) {
                const fontSize = 14; // px
                const charWidth = 7.5; // approximate px per character
                const lineHeight = fontSize * 1.4;
                const padding = 12;
                const lines = label.split("\n");
                const maxLineWidth = Math.max(
                    ...lines.map((l) => l.length * charWidth),
                );
                const totalHeight = lines.length * lineHeight;
                return Math.ceil(
                    Math.sqrt(
                        Math.pow(maxLineWidth / 2, 2) +
                            Math.pow(totalHeight / 2, 2),
                    ) + padding,
                );
            }
            flatten(data, null, 0);
            nodes.forEach((n) => {
                if (n.depth === 2) n.radius = computeLeafRadius(n.label);
            });

            const rootNode = nodes.find((n) => n.id === "root");
            rootNode.fx = cx;
            rootNode.fy = cy;

            const branches = data.children;
            const angleStep = (2 * Math.PI) / branches.length;
            branches.forEach((b, i) => {
                const angle = i * angleStep - Math.PI / 2;
                b.x = cx + Math.cos(angle) * 210;
                b.y = cy + Math.sin(angle) * 210;
                if (b.children) {
                    const childAngleStep = Math.PI / (b.children.length + 1);
                    const baseAngle = angle - Math.PI / 2;
                    b.children.forEach((c, j) => {
                        const ca = baseAngle + (j + 1) * childAngleStep + angle;
                        c.x = b.x + Math.cos(ca) * 130;
                        c.y = b.y + Math.sin(ca) * 130;
                    });
                }
            });

            const svg = d3.select("#svg");
            const g = svg.append("g");

            svg.call(
                d3
                    .zoom()
                    .scaleExtent([0.3, 2.5])
                    .on("zoom", (e) => g.attr("transform", e.transform)),
            );

            const linkSel = g
                .append("g")
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("class", "link")
                .attr("stroke", (d) => d.color);

            const nodeSel = g
                .append("g")
                .selectAll("g")
                .data(nodes)
                .join("g")
                .attr("class", "node")
                .call(
                    d3
                        .drag()
                        .on("start", (event, d) => {
                            if (!event.active) sim.alphaTarget(0.3).restart();
                            d.fx = d.x;
                            d.fy = d.y;
                        })
                        .on("drag", (event, d) => {
                            d.fx = event.x;
                            d.fy = event.y;
                        })
                        .on("end", (event, d) => {
                            if (!event.active) sim.alphaTarget(0);
                            if (d.id !== "root") {
                                d.fx = null;
                                d.fy = null;
                            }
                        }),
                );

            nodeSel
                .append("circle")
                .attr("r", (d) => d.radius)
                .attr("fill", (d) => d.color)
                .attr("stroke", (d) => d.textColor)
                .on("mouseover", (event, d) => {
                    if (d.note) {
                        const tip = document.getElementById("tooltip");
                        tip.style.display = "block";
                        tip.innerHTML = d.note.replace(/\n/g, "<br>");
                        tip.style.borderLeftColor = d.color;
                    }
                })
                .on("mousemove", (event) => {
                    const tip = document.getElementById("tooltip");
                    tip.style.left = event.pageX + 15 + "px";
                    tip.style.top = event.pageY - 10 + "px";
                })
                .on("mouseout", () => {
                    document.getElementById("tooltip").style.display = "none";
                });

            nodeSel.each(function (d) {
                const lines = d.label.split("\n");
                const el = d3.select(this);
                const fontSize =
                    d.id === "root" ? "32px" : d.depth === 1 ? "20px" : "17px";
                const fontWeight =
                    d.id === "root" ? "800" : d.depth === 1 ? "700" : "600";
                lines.forEach((line, i) => {
                    el.append("text")
                        .attr("fill", d.textColor)
                        .attr("font-size", fontSize)
                        .attr("font-weight", fontWeight)
                        .attr("dy", `${(i - (lines.length - 1) / 2) * 1.3}em`)
                        .text(line);
                });
            });

            const sim = d3
                .forceSimulation(nodes)
                .force(
                    "link",
                    d3
                        .forceLink(links)
                        .id((d) => d.id)
                        .distance((d) => {
                            if (d.depth === 1) return 210;
                            if (d.depth === 2) return 130;
                            return 100;
                        })
                        .strength(0.6),
                )
                .force("charge", d3.forceManyBody().strength(-550))
                .force(
                    "collide",
                    d3.forceCollide().radius((d) => d.radius + 14),
                )
                .force("x", d3.forceX(cx).strength(0.04))
                .force("y", d3.forceY(cy).strength(0.04))
                .on("tick", () => {
                    linkSel
                        .attr("x1", (d) => d.source.x)
                        .attr("y1", (d) => d.source.y)
                        .attr("x2", (d) => d.target.x)
                        .attr("y2", (d) => d.target.y);

                    nodeSel.attr(
                        "transform",
                        (d) => `translate(${d.x},${d.y})`,
                    );
                });
        </script>
    </body>
</html>
